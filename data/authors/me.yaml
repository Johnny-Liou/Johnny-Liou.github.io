bio: |
  #### Check out my recent work on hybrid-model acceleration: **[ReplaySSM](https://arxiv.org/pdf/2610.13778)**

  🚀 Deployed in production: [**GLM-5.3-Flash**](https://z.ai/blog/glm-built-its-inference-infrastructure#:~:text=the%20LM%20Head%2C-,ReplaySSM,-%2C%20W8A8%20quantization%2C%20mixed) and [**Kimi-K3**](https://arxiv.org/pdf/2607.24653#page=24)  
  🔧 Integrated into **vLLM**, **TensorRT-LLM**, **FlashInfer**, and **SGLang**  
  📝 Featured on the [**NVIDIA Technical Blog**](https://developer.nvidia.com/blog/replayssm-rethinking-state-storage-for-faster-hybrid-model-decoding/)

  ---

  I started the second year of my PhD at Princeton, advised by
  [**Prof. Tri Dao**](https://tridao.me). 
  My research focuses on ML Systems.

  My official name is Ze-Wei Liou, but I also go by the name "Johnny."
  I did my undergrad in EE at National Taiwan University. Feel free to reach out!

